<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier Authorization — Fleet Carrier Trade Command</title><link rel="stylesheet" href="../style.css"><meta name="robots" content="noindex,nofollow"></head><body><header class="compact"><div class="wrap"><p class="eyebrow">FLEET CARRIER TRADE COMMAND</p><h1>Frontier Authorization</h1><p class="lead" id="status">Returning authorization to the desktop application…</p></div></header><main class="wrap policy"><section><h2 id="heading">Authorization callback received</h2><p id="message">Keep Fleet Carrier Trade Command open while this page returns the result.</p><p class="small">This page does not request or store your Frontier password or OAuth tokens.</p></section></main><script>(()=>{const q=new URLSearchParams(location.search),s=q.get('state')||'',m=/^fctc\.(\d{2,5})\.([A-Za-z0-9_-]+)$/.exec(s),h=document.getElementById('heading'),st=document.getElementById('status'),msg=document.getElementById('message');if(!m){h.textContent='OAuth callback ready';st.textContent='Fleet Carrier Trade Command OAuth return endpoint is online.';msg.textContent='Start LOGIN WITH FRONTIER from the desktop application to connect your account.';return;}const port=Number(m[1]);if(port<1024||port>65535){h.textContent='Invalid callback';st.textContent='The desktop return address was invalid.';return;}const target='http://127.0.0.1:'+port+'/oauth/callback?'+q.toString();if(q.has('error')){h.textContent='Authorization was not completed';st.textContent='Returning the Frontier response to Fleet Carrier Trade Command…';}else if(q.has('code')){h.textContent='Authorization approved';st.textContent='Returning securely to Fleet Carrier Trade Command…';}else{h.textContent='Authorization response received';}msg.textContent='If the application does not resume automatically, leave it open and refresh this page.';setTimeout(()=>location.replace(target),250);})();</script></body></html>
